name: Build Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Arduino CLI
      uses: arduino/setup-arduino-cli@v1

    - name: Configure Arduino CLI
      run: |
        mkdir -p ~/.arduino15/libraries
        arduino-cli core install esp32:esp32@3.0.0

    - name: Install dependencies
      run: |
        arduino-cli lib install "WiFiManager" "ArduinoJson" "PNGdec" "AnimatedGIF" "JPEGDEC" "Adafruit GFX Library" "Adafruit BusIO"

        # Install libraries from GitHub (not in standard registry)
        mkdir -p "$HOME/Arduino/libraries"
        cd "$HOME/Arduino/libraries"

        # ESP32-HUB75-MatrixPanel-I2S-DMA
        echo "Downloading HUB75 library..."
        wget -q -O hub75.zip https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA/archive/refs/heads/master.zip
        if [ -f hub75.zip ] && unzip -q hub75.zip; then
          mv ESP32-HUB75-MatrixPanel-I2S-DMA-master ESP32-HUB75-MatrixPanel-I2S-DMA 2>/dev/null || true
          rm hub75.zip
        fi

        # SpotifyArduino
        echo "Downloading SpotifyArduino library..."
        wget -q -O spotify.zip https://github.com/MartinMueller2003/SpotifyArduino/archive/refs/heads/main.zip
        if [ -f spotify.zip ] && unzip -q spotify.zip; then
          mv SpotifyArduino-main SpotifyArduino 2>/dev/null || true
          rm spotify.zip
        fi

        # QMI8658 IMU sensor library
        echo "Downloading QMI8658 library..."
        wget -q -O qmi8658.zip https://github.com/haechi/QMI8658/archive/refs/heads/main.zip
        if [ -f qmi8658.zip ] && unzip -q qmi8658.zip; then
          mv QMI8658-main QMI8658 2>/dev/null || true
          rm qmi8658.zip
        fi

    - name: Create secrets.h from example
      run: |
        cp firmware/DeskMatrix/secrets.h.example firmware/DeskMatrix/secrets.h

    - name: Compile firmware
      run: |
        arduino-cli compile \
          --fqbn esp32:esp32:esp32s3:FlashSize=32M,PSRAM=opi,PartitionScheme=app5M_little24M_32MB,CDCOnBoot=cdc \
          --output-dir build \
          firmware/DeskMatrix/DeskMatrix.ino

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: DeskMatrix-firmware
        path: build/DeskMatrix.ino.bin
        retention-days: 30

    - name: Check build size
      run: |
        ls -lh build/DeskMatrix.ino.bin
        echo "Firmware size:"
        stat -f%z build/DeskMatrix.ino.bin 2>/dev/null || stat -c%s build/DeskMatrix.ino.bin

    - name: Create Release (on main branch)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/DeskMatrix.ino.bin
        tag_name: firmware-${{ github.run_number }}
        name: Firmware Build ${{ github.run_number }}
        body: |
          Automated firmware build from commit ${{ github.sha }}

          To flash this firmware:
          ```bash
          curl -u admin:PASSWORD --data-binary @DeskMatrix.ino.bin http://<device-ip>/api/ota
          ```

          Or upload via the web UI at `http://<device-ip>/` (Device → Firmware Update section)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
