name: Build Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Arduino CLI
      uses: arduino/setup-arduino-cli@v1

    - name: Configure Arduino CLI
      run: |
        mkdir -p ~/.arduino15/libraries
        arduino-cli core install esp32:esp32@3.0.0

    - name: Install dependencies
      run: |
        arduino-cli lib install \
          "WiFiManager" \
          "ArduinoJson" \
          "PNGdec" \
          "AnimatedGIF" \
          "JPEGDEC" \
          "Adafruit GFX Library" \
          "Adafruit BusIO" \
          "ESP32 HUB75 LED MATRIX PANEL DMA Display" \
          "SensorLib"

    - name: Install SpotifyArduino (not in Library Manager registry)
      run: |
        mkdir -p "$HOME/Arduino/libraries"
        git clone --depth 1 https://github.com/witnessmenow/spotify-api-arduino.git \
          "$HOME/Arduino/libraries/SpotifyArduino"

    - name: Create secrets.h
      env:
        DEVICE_ADMIN_USER: ${{ secrets.DEVICE_ADMIN_USER }}
        DEVICE_ADMIN_PASS: ${{ secrets.DEVICE_ADMIN_PASS }}
      run: |
        # Public release binaries must not ship with the placeholder
        # password from secrets.h.example (it's world-readable in this
        # repo). Bake in a real password from repo secrets instead, so
        # every CI-built release is protected by a value nobody outside
        # this repo's admins can see. Falls back to the placeholder only
        # if the repo secrets aren't configured (e.g. a fork's first PR
        # build), so the build never breaks — but that fallback binary
        # is not safe to deploy as-is.
        USER="${DEVICE_ADMIN_USER:-admin}"
        PASS="${DEVICE_ADMIN_PASS:-your_secure_password_here}"
        {
          echo "// firmware/DeskMatrix/secrets.h"
          echo "// Generated at CI build time from repository secrets. Never committed."
          echo "#pragma once"
          echo "#define CONFIG_AUTH_USER \"${USER}\""
          echo "#define CONFIG_AUTH_PASS \"${PASS}\""
        } > firmware/DeskMatrix/secrets.h

    - name: Compile firmware
      run: |
        # esp32:esp32@3.0.0's boards.txt has a known ordering issue where
        # FlashSize's own default build.partitions (app5M_fat24M_32MB) can
        # win over the PartitionScheme menu selection depending on how
        # arduino-cli resolves overlapping menu properties. Force the
        # correct partitions table directly so the build is deterministic
        # regardless of that resolution order.
        arduino-cli compile \
          --fqbn esp32:esp32:esp32s3:FlashSize=32M,PSRAM=opi,PartitionScheme=app5M_little24M_32MB,CDCOnBoot=cdc \
          --build-property "build.partitions=large_littlefs_32MB" \
          --build-property "upload.maximum_size=4718592" \
          --output-dir build \
          firmware/DeskMatrix/DeskMatrix.ino

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: DeskMatrix-firmware
        path: build/DeskMatrix.ino.bin
        retention-days: 30

    - name: Check build size
      run: |
        ls -lh build/DeskMatrix.ino.bin
        echo "Firmware size:"
        stat -f%z build/DeskMatrix.ino.bin 2>/dev/null || stat -c%s build/DeskMatrix.ino.bin

    - name: Create Release (on main branch)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/DeskMatrix.ino.bin
        tag_name: firmware-${{ github.run_number }}
        name: Firmware Build ${{ github.run_number }}
        body: |
          Automated firmware build from commit ${{ github.sha }}

          To flash this firmware:
          ```bash
          curl -u admin:PASSWORD --data-binary @DeskMatrix.ino.bin http://<device-ip>/api/ota
          ```

          Or upload via the web UI at `http://<device-ip>/` (Device → Firmware Update section)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
